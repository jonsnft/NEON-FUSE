name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker compose config
      - run: docker build -f deploy/server.Dockerfile -t neon-fuse-server:ci .
      - run: docker build -f deploy/client.Dockerfile --build-arg VITE_GAME_SERVER_URL=http://localhost:2567 -t neon-fuse-client:ci .
